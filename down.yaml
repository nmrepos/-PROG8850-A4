- hosts: localhost
  connection: local
  become: true
  gather_facts: false

  tasks:
    - name: Ensure migrations directory exists
      ansible.builtin.file:
        path: "./migrations"
        state: directory

    - name: Dump subscriber data for next run
      ansible.builtin.shell: >
        mysqldump subscribers subscriber
          --skip-triggers
          --no-create-info
        > migrations/R__seed_data.sql

    - name: Stop MySQL service
      ansible.builtin.service:
        name: mysql
        state: stopped
